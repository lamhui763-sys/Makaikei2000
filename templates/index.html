<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>TravelEasy - Plan your trip</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body class="container py-5">
    <h1 class="mb-4">TravelEasy Assistant</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-success">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}
    <form method="POST" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Your Email</label>
        <input type="email" name="email" required class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Origin (IATA code)</label>
        <input type="text" name="origin" required class="form-control" placeholder="HKG">
      </div>
      <div class="col-md-6">
        <label class="form-label">Destination (IATA code)</label>
        <input type="text" name="destination" required class="form-control" placeholder="NRT">
      </div>
      <div class="col-md-6">
        <label class="form-label">Departure Date</label>
        <input type="date" name="depart_date" required class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Trip Length (days)</label>
        <input type="number" name="trip_length" required class="form-control" value="7">
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Schedule Trip</button>
      </div>
    </form>
  </body>
</html>
